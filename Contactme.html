<!DOCTYPE html>
<html lang="id">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Contact Me - Javier Achmad</title>
        <link rel="stylesheet" href="style.css"/>
    </head>
    <body>
        <!--NAVIGATION BAR-->
        <div class="Container-Navbar">
            <ul class="Ul-Navbar">
                <li class="Li-Navbar"><a href="index.html" class="a-navbar">My Name</a></li>
                <li class="Li-Navbar"><a href="about.html" class="a-navbar">About Me</a></li>
                <li class="Li-Navbar"><a href="Contactme.html" class="a-navbar">Contact Me</a></li>
            </ul>
        </div>
        <!--NAVIGATION BAR SELESAI-->
        
        <!--CONTENT 1: LOGO UTAMA-->
        <div class="Container-konten">
            <a href="https://github.com/javierachmad" class="a-konten">
                <img src="assets/logogithub.png" width="200" height="200" class="img-konten" />
                <p class="b-konten">Contact me</p>
            </a>
        </div>
        <!--CONTENT 1 SELESAI-->

        <!--CONTENT 2: FORM KONTAK TERPISAH-->
        <div class="Container-konten" style="background-color: #f4f4f9;">
            <div class="contact-card">
                <h2 class="form-title">Kontak Kami</h2>
                <form id="contactForm">
                    <div class="form-group">
                        <label for="nama">Nama</label>
                        <input type="text" id="nama" name="nama" required>
                    </div>
                    <div class="form-group">
                        <label for="email">E-mail</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                    <div class="form-group">
                        <label for="pesan">Pesan</label>
                        <textarea id="pesan" name="pesan" placeholder="Ketik di sini..." rows="4" required></textarea>
                    </div>
                    <button type="submit" class="btn-submit">Kirim</button>
                </form>
            </div>
        </div>

        <!--FOOTER-->
        <div class="Footer-konten">
            <h1 class="h1-konten">Hello my name is Javier Achmad</h1>
        </div>
        <!--FOOTER SELESAI-->

        <script src="script.js"></script>
    </body>
</html>
